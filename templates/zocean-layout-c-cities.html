<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Z Ocean Tours · Layout C "Seasonal cover + city cards": serif cover title, wide hero, 3 city cards with nights + don't-miss + train links, 8-inclusion grid -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; font-family:'Inter','Noto Color Emoji',sans-serif; }
  .p { position:relative; width:1080px; height:1350px; background:linear-gradient(180deg,#06215e 0%,#0a4fd6 46%,#fff8ec 46.1%,#fff8ec 100%); color:#12284f; overflow:hidden; }
  .logo { position:absolute; top:30px; left:40px; background:#fff; border-radius:20px; padding:8px 20px; box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .logo img { height:88px; display:block; }
  .sticker { position:absolute; top:22px; right:40px; width:170px; height:170px; border-radius:50%; background:#ffd23f; color:#06215e; display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-8deg); box-shadow:0 10px 24px rgba(0,0,0,.3); border:5px dashed #ff6a1a; }
  .sticker b { font-family:'Archivo Black',sans-serif; font-size:56px; line-height:1; }
  .sticker span { font-size:19px; font-weight:800; letter-spacing:2px; }
  .sticker small { font-size:16px; font-weight:700; }
  .kick { position:absolute; top:150px; left:40px; color:#ffb000; font-size:21px; font-weight:800; letter-spacing:5px; }
  h1 { position:absolute; top:182px; left:40px; right:230px; color:#fff; font-family:'Lora',serif; font-size:60px; line-height:1.05; font-weight:700; }
  h1 span { color:#ffd23f; font-style:italic; }
  .hero { position:absolute; top:340px; left:0; }
  .cards { position:absolute; top:596px; left:40px; right:40px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:58px; }
  .card { background:#fff; border-radius:22px; box-shadow:0 12px 30px rgba(10,79,214,.18); overflow:hidden; position:relative; }
  .card .top { background:#ff6a1a; color:#fff; padding:12px 18px; display:flex; justify-content:space-between; align-items:baseline; }
  .card .top b { font-family:'Lora',serif; font-size:29px; }
  .card .top span { font-size:18px; font-weight:800; background:#fff; color:#ff6a1a; border-radius:14px; padding:3px 10px; }
  .card ul { list-style:none; padding:12px 16px 14px; }
  .card li { font-size:18px; line-height:1.3; padding:6px 0; border-top:1.5px dashed #e4ecf8; }
  .card li:first-child { border-top:none; }
  .link { position:absolute; top:670px; width:50px; text-align:center; font-size:14px; font-weight:800; color:#06215e; background:#ffd23f; border-radius:12px; padding:6px 0; z-index:3; line-height:1.15; }
  .incs { position:absolute; top:852px; left:40px; right:40px; background:#0a4fd6; border-radius:24px; padding:18px 22px 20px; color:#fff; }
  .incs h2 { font-size:20px; letter-spacing:5px; color:#ffd23f; font-weight:800; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .inc { background:rgba(255,255,255,.12); border-radius:14px; padding:10px 10px; font-size:18px; font-weight:600; line-height:1.25; display:flex; gap:8px; align-items:center; }
  .inc i { font-style:normal; font-size:26px; }
  .who { position:absolute; top:1094px; left:40px; width:560px; font-size:20px; line-height:1.4; color:#33507f; }
  .who b { color:#ff6a1a; }
  .cta { position:absolute; top:1100px; right:40px; background:linear-gradient(90deg,#ffb000,#ff6a1a); color:#fff; border-radius:40px; padding:16px 26px; font-size:23px; font-weight:800; box-shadow:0 8px 20px rgba(255,106,26,.35); text-align:center; line-height:1.2; }
  .foot { position:absolute; bottom:0; left:0; right:0; height:136px; background:#06215e; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .foot .w { font-size:32px; font-weight:800; letter-spacing:3px; color:#ffd23f; }
  .foot .r { display:flex; gap:40px; font-size:27px; font-weight:600; }
</style></head><body><div class="p">
  {{HERO_SVG}}
  <div class="logo"><img src="assets/zocean-logo.jpg"></div>
  <div class="sticker"><b>{{DAYS}}</b><span>DAYS</span><small>{{NIGHTS}}</small></div>
  <div class="kick">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <div class="cards">{{CARDS}}</div>
  {{LINKS}}
  <div class="incs"><h2>WHAT'S INCLUDED</h2><div class="grid">{{INCS}}</div></div>
  <div class="who">{{WHO}}</div>
  <div class="cta">GET YOUR QUOTE<br>ON WHATSAPP 💬</div>
  <div class="foot"><div class="w">WWW.Z-OCEANTOURS.COM</div><div class="r"><span>💬 +33 7 51 13 64 73</span><span>✉️ info@zoceantours.com</span></div></div>
</div></body></html>
