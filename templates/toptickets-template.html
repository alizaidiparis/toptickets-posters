<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; font-family:'Inter',sans-serif; color:#f4ead7; }
  .poster { position:relative; width:1080px; height:1350px;
    background: radial-gradient(ellipse at 50% 34%, #24365a 0%, #14213a 60%, #0d1628 100%); }
  /* header */
  .head { position:absolute; top:0; left:0; right:0; height:150px; display:flex; align-items:center; justify-content:center; gap:26px; background:#fff; }
  .head img { width:104px; height:104px; }
  .head .name { font-size:50px; font-weight:800; letter-spacing:2px; color:#14213a; line-height:1; }
  .head .name span { color:#ff6b52; }
  .head .tag { font-size:20px; font-weight:500; letter-spacing:3px; color:#5b6478; margin-top:8px; }
  .clock { position:absolute; top:186px; left:50%; transform:translateX(-50%); }
  .kicker { position:absolute; top:704px; left:0; right:0; text-align:center; font-size:24px; letter-spacing:8px; color:#d9b56a; font-weight:500; }
  h1 { position:absolute; top:738px; left:0; right:0; text-align:center; font-family:'Crimson Text',serif; font-weight:600; font-size:120px; line-height:1; color:#f8efdd; }
  .artists { position:absolute; top:880px; left:0; right:0; text-align:center; font-family:'Lora',serif; font-style:italic; font-size:32px; color:#e8d9b8; }
  .badges { position:absolute; top:950px; left:0; right:0; display:flex; justify-content:center; gap:22px; }
  .badge { border:1.5px solid rgba(217,181,106,.7); border-radius:40px; padding:12px 26px; font-size:24px; font-weight:500; }
  .badge b { color:#d9b56a; margin-right:8px; }
  .cta { position:absolute; top:1034px; left:50%; transform:translateX(-50%); background:#ff6b52; color:#fff; border-radius:60px; padding:22px 60px; font-size:36px; font-weight:800; white-space:nowrap; }
  /* footer contact bar */
  .foot { position:absolute; bottom:0; left:0; right:0; height:196px; background:#ff6b52; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; }
  .row { display:flex; gap:44px; align-items:center; }
  .item { display:flex; align-items:center; gap:14px; font-size:32px; font-weight:700; }
  .ico { width:46px; height:46px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
  .web { font-size:38px; font-weight:800; letter-spacing:3px; }
</style></head>

    <line x1="300" y1="300" x2="300" y2="120" stroke="#0f1a2e" stroke-width="12" stroke-linecap="round" transform="rotate(300 300 300)"/>
